version: 2

models:
  - name: dim_customers
    description: Customer details. PII columns are masked by Snowflake masking policies.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

      - name: full_name
        description: Masked unless role is COMPLIANCE_OFFICER.
        config:
          meta:
            contains_pii: true

      - name: phone
        description: Shows last 4 digits unless role is COMPLIANCE_OFFICER.
        config:
          meta:
            contains_pii: true

      - name: aadhaar_number
        description: Shows last 4 digits unless role is COMPLIANCE_OFFICER.
        config:
          meta:
            contains_pii: true

  - name: fct_loan_daily_status
    description: One row per loan per day with DPD and RBI asset classification.
    columns:
      - name: loan_id
        data_tests: [not_null]

      - name: status_date
        data_tests: [not_null]

      - name: asset_class
        data_tests: [not_null]

  - name: fct_portfolio_month_end_snapshot
    description: Frozen month-end portfolio, based on payments posted by month-end.
    columns:
      - name: snapshot_date
        data_tests: [not_null]

      - name: loan_id
        data_tests: [not_null]

      - name: asset_class
        data_tests: [not_null]

  - name: fct_branch_monthly_metrics
    description: GNPA, PAR 30 and collection efficiency per branch per month.
    columns:
      - name: snapshot_date
        data_tests: [not_null]

      - name: branch_id
        data_tests: [not_null]

  - name: fct_monthly_roll_rates
    description: Movement of loans between RBI categories month over month.
    columns:
      - name: from_class
        data_tests: [not_null]

      - name: to_class
        data_tests: [not_null]

  - name: rpt_month_end_restatements
    description: Reported (frozen) vs current view of each month-end.
    columns:
      - name: snapshot_date
        data_tests: [unique, not_null]